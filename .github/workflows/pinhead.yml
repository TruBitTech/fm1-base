name: Build Pin Head

on:
  push:
    branches: [ main ]
    paths:
      - 'pinhead/**'
      - '.github/workflows/pinhead.yml'
  pull_request:
    paths:
      - 'pinhead/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl xz-utils python3 git

      - name: Get JieLi toolchain
        run: |
          tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> $GITHUB_ENV

      - name: Get AC79 SDK
        run: |
          git clone --depth 1 https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK" || \
            git clone --depth 1 https://github.com/MrUglyHandsome/fw-AC79_AIoT_SDK_v1.2.0.git "$HOME/fw-AC79_AIoT_SDK"
          echo "AC79_SDK=$HOME/fw-AC79_AIoT_SDK" >> $GITHUB_ENV

      - name: Build Pin Head firmware
        run: |
          tools/build.py pinhead

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: pinhead-fwsc
          path: |
            pinhead/build/*.fwsc
            pinhead/build/*.bin
          retention-days: 30
